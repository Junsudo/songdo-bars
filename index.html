<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송도 술집 지도 — IGC 기준</title>
<meta name="description" content="인천글로벌캠퍼스(IGC) 기준 송도 술집 지도 — 인허가 면적·추정 좌석·도보/택시 시간·전화번호">
<meta property="og:title" content="송도 술집 지도 — IGC 기준">
<meta property="og:description" content="IGC에서 도보·택시 시간, 면적 기반 추정 좌석, 전화번호까지 한눈에">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍺</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/map_data.js"></script>
<script src="data/transit.js"></script>
<style>
  :root {
    --surface: #fcfcfb; --panel: #ffffff; --border: #e6e4df;
    --text-1: #0b0b0b; --text-2: #52514e; --text-3: #8a8781;
    --accent: #2a78d6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; color: var(--text-1); background: var(--surface); display: flex; }
  #side { width: 420px; min-width: 330px; height: 100%; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--border); }
  #map { flex: 1; height: 100%; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--text-2); margin-top: 3px; }
  #controls { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  input[type=search] { flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); }
  select { padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); color: var(--text-1); }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; cursor: pointer; user-select: none; background: var(--surface); color: var(--text-2); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip.on { border-color: var(--text-2); color: var(--text-1); background: #f4f3f0; }
  .chip.off { opacity: .38; }
  .toggle { font-size: 12px; color: var(--text-2); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  #count { font-size: 12px; color: var(--text-3); margin-left: auto; }
  #list { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .item { padding: 10px 16px; border-bottom: 1px solid #f1f0ec; cursor: pointer; }
  .item:hover, .item.active { background: #f4f6fa; }
  .item .t { display: flex; align-items: baseline; gap: 7px; }
  .item .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; align-self: center; }
  .item .dot.unlic { background: transparent !important; border: 2px dashed currentColor; }
  .item .nm { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .walk { margin-left: auto; font-size: 12px; color: var(--text-2); flex: none; font-variant-numeric: tabular-nums; }
  .item .meta { font-size: 12px; color: var(--text-2); margin-top: 3px; padding-left: 17px; }
  .item .meta a { color: var(--accent); text-decoration: none; }
  .badge { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: 1px; }
  .badge.big { background: #ece9f8; color: #3a2d86; }
  .badge.unlic { background: #f3f2ef; color: var(--text-3); }
  .badge.multi { background: #e7f1fc; color: #1c5cab; }
  .leaflet-popup-content { font-family: inherit; font-size: 13px; line-height: 1.55; margin: 12px 14px; min-width: 220px; }
  .pop-nm { font-size: 14.5px; font-weight: 700; margin-bottom: 2px; }
  .pop-cat { font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .pop-kv { color: var(--text-2); } .pop-kv b { color: var(--text-1); font-weight: 600; }
  .pop-links { margin-top: 7px; display: flex; gap: 10px; flex-wrap: wrap; }
  .pop-links a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12.5px; }
  #areaCtl { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 1000;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 7px;
    display: flex; flex-direction: column; align-items: center; gap: 7px; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
  #areaCtl .lab { font-size: 11px; color: var(--text-2); text-align: center; line-height: 1.3; width: 52px; }
  #areaCtl .lab b { color: var(--text-1); font-size: 12px; }
  #areaMin, #areaMax { writing-mode: vertical-lr; direction: rtl; -webkit-appearance: slider-vertical; width: 20px; height: 150px; accent-color: var(--accent); }
  .ring-label { background: none; border: none; box-shadow: none; font-weight: 700; color: #444; font-size: 11px; text-shadow: 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
  @media (max-width: 760px) {
    body { flex-direction: column-reverse; }
    #side { width: 100%; height: 48%; min-width: 0; border-right: none; border-top: 1px solid var(--border); }
    #map { height: 52%; }
  }
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>송도 술집 지도</h1>
    <div class="sub">인천글로벌캠퍼스(IGC) 기준 · 연수구 인허가 대장 + 카카오맵 + 네이버 · 2026-08-19</div>
  </header>
  <div id="controls">
    <div class="row">
      <input id="q" type="search" placeholder="상호 검색">
      <select id="sort">
        <option value="walk">도보 빠른 순</option>
        <option value="taxi">택시 빠른 순</option>
        <option value="dist">직선거리 순</option>
        <option value="area">면적 큰 순</option>
        <option value="name">이름순</option>
      </select>
    </div>
    <div class="row" id="cats"></div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="f-big"> 100석급(200㎡+)만</label>
      <label class="toggle"><input type="checkbox" id="f-naver"> 네이버 등록만</label>
      <span id="count"></span>
    </div>
    <div class="row" id="srcs" style="font-size:12px"><span style="color:var(--text-3);font-size:12px">출처</span></div>
  </div>
  <div id="list"></div>
</div>
<div id="map">
  <div id="areaCtl">
    <div class="lab"><b id="areaVal">전체</b><br><span id="areaSeat">면적 필터</span></div>
    <div style="display:flex;gap:4px">
      <input id="areaMin" type="range" orient="vertical" min="0" max="400" step="10" value="0" title="하한">
      <input id="areaMax" type="range" orient="vertical" min="0" max="400" step="10" value="400" title="상한">
    </div>
    <div class="lab" style="font-size:10px;color:var(--text-3)">하한 · 상한</div>
  </div>
</div>
<script>
const D = window.MAP_DATA;
const CAT_COLOR = { "호프·펍": "#2a78d6", "이자카야": "#eb6834", "포차·주점": "#1baf7a", "바·라운지": "#e87ba4", "대형(200㎡+)": "#4a3aa7" };
const CATS = Object.keys(CAT_COLOR);
const R = 6371000;
const MOBILE = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
function hav(a, b) {
  const dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
D.venues.forEach(v => { v.dist = hav(D.igc, v); });
// 같은 건물(≈11m 셀) 업소들을 링으로 펼쳐 핀이 포개지지 않게 함 — 표시 좌표(dlat/dlng)만 이동, 원좌표는 링크·거리 계산에 유지
{
  const cells = new Map();
  D.venues.forEach(v => {
    const k = v.lat.toFixed(4) + "," + v.lng.toFixed(4);
    (cells.get(k) || cells.set(k, []).get(k)).push(v);
  });
  cells.forEach(group => {
    if (group.length === 1) { const v = group[0]; v.dlat = v.lat; v.dlng = v.lng; return; }
    group.sort((a, b) => (b.area || 0) - (a.area || 0));
    const cLat = group.reduce((s, v) => s + v.lat, 0) / group.length;
    const cLng = group.reduce((s, v) => s + v.lng, 0) / group.length;
    group.forEach((v, i) => {
      const ring = Math.floor(i / 8), slot = i % 8, n = Math.min(group.length - ring * 8, 8);
      const rad = 13 + ring * 15;                          // m
      const ang = (slot / n) * 2 * Math.PI + ring * 0.4;
      v.dlat = cLat + (rad * Math.cos(ang)) / 111320;
      v.dlng = cLng + (rad * Math.sin(ang)) / (111320 * Math.cos(cLat * Math.PI / 180));
    });
  });
}
const fmtDist = m => m < 1000 ? Math.round(m) + " m" : (m/1000).toFixed(1) + " km";
const fmtFare = f => f ? "₩" + f.toLocaleString("ko-KR") : "";
const seats = a => a ? Math.round(a/2) + "~" + Math.round(a/1.65) + "석" : null;  // 실측 보정(150㎡=90석)
const telHref = p => "tel:" + p.replace(/[^0-9]/g, "");
const transitHref = v => MOBILE
  ? `kakaomap://route?sp=${D.igc.lat},${D.igc.lng}&ep=${v.lat},${v.lng}&by=PUBLICTRANSIT`
  : `https://map.kakao.com/link/to/${encodeURIComponent(v.name)},${v.lat},${v.lng}`;

// ── 지도 ──
const map = L.map("map", { zoomControl: true }).setView([D.igc.lat, D.igc.lng], 15);
const carto = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { maxZoom: 20, attribution: "&copy; OpenStreetMap &copy; CARTO" }).addTo(map);
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" });
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Esri World Imagery" });
let layerCtl;  // 오버레이는 아래에서 등록

// 교통 오버레이
const T = window.TRANSIT || { line1: [], stations: [], bus42: [] };
const subwayG = L.layerGroup();
T.line1.forEach(seg => L.polyline(seg, { color: "#6f99c8", weight: 3, opacity: .8, interactive: false }).addTo(subwayG));
T.stations.forEach(s => L.circleMarker([s.lat, s.lng], { radius: 5.5, color: "#3c6ea5", weight: 2, fillColor: "#fff", fillOpacity: 1 })
  .bindTooltip(s.name, { direction: "top" }).addTo(subwayG));
subwayG.addTo(map);
const busG = L.layerGroup();
T.bus42.forEach(s => L.circleMarker([s.lat, s.lng], { radius: 4, color: "#fff", weight: 1.2, fillColor: "#2c9f45", fillOpacity: .95 })
  .bindTooltip("순환42 · " + s.name, { direction: "top" }).addTo(busG));
busG.addTo(map);
const igcIcon = L.divIcon({ className: "", html: `<div style="width:26px;height:26px;border-radius:50%;background:#0b0b0b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)">IGC</div>`, iconSize: [26,26], iconAnchor: [13,13] });
L.marker([D.igc.lat, D.igc.lng], { icon: igcIcon, zIndexOffset: 1000 }).addTo(map).bindPopup("<b>인천글로벌캠퍼스</b><br>송도동 187");
[[500,"500m"],[1000,"1km"],[2000,"2km"]].forEach(([r, lab]) => {
  L.circle([D.igc.lat, D.igc.lng], { radius: r, fill: false, color: "#7a7770", weight: 1, dashArray: "4 5", interactive: false }).addTo(map);
  L.marker([D.igc.lat + r/R*180/Math.PI, D.igc.lng], { icon: L.divIcon({ className: "ring-label", html: lab, iconAnchor: [12, 8] }), interactive: false }).addTo(map);
});

// ── 마커 ──
const state = { cats: new Set(CATS), big: false, naver: false, q: "", sort: "walk", srcs: new Set(["both", "lic", "kko"]), minArea: 0 };
const SRC_LABEL = { both: "인허가+카카오", lic: "인허가만", kko: "카카오만" };
const srcOf = v => !v.licensed ? "kko" : (v.kakao_url || v.coord_src === "kakao") ? "both" : "lic";
const markers = new Map();
const radiusOf = v => v.area ? Math.max(6, Math.min(22, Math.sqrt(v.area) * 0.95)) : 6;
function popupHtml(v) {
  const rows = [];
  if (v.area) rows.push(`<div class="pop-kv">면적 <b>${v.area.toFixed(0)}㎡</b> · ${v.seat_confirmed ? "확인 <b>" + v.seat_confirmed + "석</b> (전화)" : "추정 <b>" + seats(v.area) + "</b>"}</div>`);
  rows.push(`<div class="pop-kv">🚶 도보 <b>${v.walk_min ?? "-"}분</b>${v.walk_km ? ` (${v.walk_km}km)` : ""} · 🚕 택시 <b>${v.taxi_min ?? "-"}분</b>${v.taxi_fare ? " · 약 " + fmtFare(v.taxi_fare) : ""}</div>`);
  if (v.uptae) rows.push(`<div class="pop-kv">인허가 업태 <b>${v.uptae}</b>${v.multi_use ? " · 다중이용업소" : ""}</div>`);
  if (v.naver_cat) rows.push(`<div class="pop-kv">네이버 <b>${v.naver_cat}</b></div>`);
  rows.push(`<div class="pop-kv" style="margin-top:4px">${v.road || v.jibun}</div>`);
  if (!v.licensed) rows.push(`<div class="pop-kv" style="color:#8a8781">인허가 대장 미매칭 — 전화로 확인 필요</div>`);
  const links = [];
  if (v.phone) links.push(`<a href="${telHref(v.phone)}">☎ ${v.phone}</a>`);
  links.push(`<a href="${transitHref(v)}" target="_blank" rel="noopener">🚌 대중교통(실시간)</a>`);
  if (v.kakao_url) links.push(`<a href="${v.kakao_url}" target="_blank" rel="noopener">카카오맵</a>`);
  links.push(`<a href="https://map.naver.com/p/search/${encodeURIComponent(v.name + " 송도")}" target="_blank" rel="noopener">네이버</a>`);
  return `<div class="pop-nm">${v.name}</div><div class="pop-cat">${v.cat}</div>${rows.join("")}<div class="pop-links">${links.join("")}</div>`;
}
D.venues.forEach((v, i) => {
  v.id = i;
  const m = L.circleMarker([v.dlat, v.dlng], {
    radius: radiusOf(v), color: "#fff", weight: 1.5,
    fillColor: CAT_COLOR[v.cat], fillOpacity: v.licensed ? 0.88 : 0.45,
  }).bindPopup(popupHtml(v));
  m.on("click", () => highlight(v.id, false));
  markers.set(v.id, m);
});

// ── 필터/정렬/리스트 ──
const $ = s => document.querySelector(s);
CATS.forEach(c => {
  const el = document.createElement("span");
  el.className = "chip on";
  el.innerHTML = `<span class="dot" style="background:${CAT_COLOR[c]}"></span>${c}`;
  el.onclick = () => { state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c); el.classList.toggle("off", !state.cats.has(c)); render(); };
  $("#cats").appendChild(el);
});
$("#q").oninput = e => { state.q = e.target.value.trim(); render(); };
$("#sort").onchange = e => { state.sort = e.target.value; render(); };
$("#f-big").onchange = e => { state.big = e.target.checked; render(); };
$("#f-naver").onchange = e => { state.naver = e.target.checked; render(); };
const areaCtl = document.getElementById("areaCtl");
L.DomEvent.disableClickPropagation(areaCtl); L.DomEvent.disableScrollPropagation(areaCtl);
const AMAX = Math.ceil(Math.max(...D.venues.map(v => v.area || 0)) / 10) * 10;
$("#areaMin").max = AMAX; $("#areaMax").max = AMAX; $("#areaMax").value = AMAX;
state.maxArea = AMAX;
function areaLabel() {
  const lo = state.minArea, hi = state.maxArea, dflt = !lo && hi >= AMAX;
  $("#areaVal").textContent = dflt ? "전체" : `${lo}~${hi >= AMAX ? "" : hi}㎡`.replace("~㎡", "㎡+");
  $("#areaSeat").textContent = dflt ? "면적 필터" : `약 ${Math.round(lo/2)}~${hi >= AMAX ? "" : Math.round(hi/1.65)}석`.replace("~석", "석+");
}
$("#areaMin").oninput = e => {
  state.minArea = Math.min(+e.target.value, state.maxArea); e.target.value = state.minArea;
  areaLabel(); render();
};
$("#areaMax").oninput = e => {
  state.maxArea = Math.max(+e.target.value, state.minArea); e.target.value = state.maxArea;
  areaLabel(); render();
};
Object.entries(SRC_LABEL).forEach(([k, label]) => {
  const el = document.createElement("span");
  el.className = "chip on";
  el.textContent = label;
  el.onclick = () => { state.srcs.has(k) ? state.srcs.delete(k) : state.srcs.add(k); el.classList.toggle("off", !state.srcs.has(k)); render(); };
  $("#srcs").appendChild(el);
});

const SORTS = {
  walk: (a, b) => (a.walk_min ?? 1e9) - (b.walk_min ?? 1e9) || a.dist - b.dist,
  taxi: (a, b) => (a.taxi_min ?? 1e9) - (b.taxi_min ?? 1e9) || a.dist - b.dist,
  dist: (a, b) => a.dist - b.dist,
  area: (a, b) => (b.area || 0) - (a.area || 0),
  name: (a, b) => a.name.localeCompare(b.name, "ko"),
};
function visible() {
  return D.venues.filter(v =>
    state.cats.has(v.cat) &&
    (!state.big || (v.area || 0) >= 200) &&
    (!state.naver || v.naver_ok) &&
    ((!state.minArea && state.maxArea >= AMAX) || (v.area && v.area >= state.minArea && v.area <= state.maxArea)) &&
    state.srcs.has(srcOf(v)) &&
    (!state.q || v.name.toLowerCase().includes(state.q.toLowerCase()))
  ).sort(SORTS[state.sort]);
}
function render() {
  const vs = visible();
  const shown = new Set(vs.map(v => v.id));
  markers.forEach((m, id) => { const has = map.hasLayer(m); if (shown.has(id) && !has) m.addTo(map); else if (!shown.has(id) && has) m.remove(); });
  $("#count").textContent = vs.length + "곳";
  $("#list").innerHTML = vs.map(v => `
    <div class="item" id="it-${v.id}" onclick="highlight(${v.id}, true)">
      <div class="t">
        <span class="dot ${v.licensed ? "" : "unlic"}" style="background:${CAT_COLOR[v.cat]};color:${CAT_COLOR[v.cat]}"></span>
        <span class="nm">${v.name}</span>
        <span class="walk">🚶${v.walk_min ?? "-"}분·🚕${v.taxi_min ?? "-"}분</span>
      </div>
      <div class="meta">
        ${v.area ? v.area.toFixed(0) + "㎡ · " + (v.seat_confirmed ? "<b>확인 " + v.seat_confirmed + "석(전화)</b>" : seats(v.area)) : "면적 미상"}
        ${(v.area || 0) >= 200 ? '<span class="badge big">100석급</span>' : ""}
        ${v.multi_use ? '<span class="badge multi">다중이용업소</span>' : ""}
        ${v.licensed ? "" : '<span class="badge unlic">인허가 미매칭</span>'}
        ${v.naver_ok ? "" : '<span class="badge unlic">네이버 미등록</span>'}
        <br>${v.phone ? `<a href="${telHref(v.phone)}" onclick="event.stopPropagation()">☎ ${v.phone}</a>` : "☎ —"}
        ${v.taxi_fare ? " · 택시 약 " + fmtFare(v.taxi_fare) : ""}
        ${v.seat_blog ? " · 블로그 " + v.seat_blog + "석 언급" : ""}${v.group_blog ? " · 단체 " + v.group_blog + "명 언급" : ""}
      </div>
    </div>`).join("");
}
window.highlight = (id, fly) => {
  document.querySelectorAll(".item.active").forEach(e => e.classList.remove("active"));
  const it = document.getElementById("it-" + id);
  if (it) { it.classList.add("active"); it.scrollIntoView({ block: "nearest" }); }
  const v = D.venues[id], m = markers.get(id);
  if (fly && m) { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 17), { duration: 0.4 }); m.openPopup(); }
};
layerCtl = L.control.layers({ "라이트": carto, "일반(OSM)": osm, "위성": sat }, { "인천1호선": subwayG, "순환42 정류장": busG }, { position: "topright" }).addTo(map);
render();
</script>
